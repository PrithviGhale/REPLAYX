name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do, and what gets in the way? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposal }
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This works fully offline, needs no account and adds no telemetry
          required: true
