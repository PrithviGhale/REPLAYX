# Builds the Windows installer for a version tag and attaches it to a DRAFT
# release. Nothing is published automatically: a maintainer reviews the draft,
# runs the hardware checklist in docs/VALIDATION.md, and publishes it by hand.
#
# Optional repository configuration for signed in-app updates:
#   secrets.TAURI_SIGNING_PRIVATE_KEY, secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   vars.REPLAYX_UPDATE_PUBKEY  (public key matching the private key)
# Without them the installer is built without updater artifacts and the app
# reports updates as unavailable.
name: Release (draft)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package version $version" }
      - name: Pinned FFmpeg runtime
        shell: pwsh
        run: ./scripts/setup-media.ps1
      - name: Checks
        shell: pwsh
        env:
          REPLAYX_NO_HARDWARE: '1'
        run: ./scripts/check.ps1
      - name: Bundle resources
        shell: pwsh
        run: ./scripts/prepare-bundle.ps1
      - name: Build installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REPLAYX_UPDATE_PUBKEY: ${{ vars.REPLAYX_UPDATE_PUBKEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and $env:REPLAYX_UPDATE_PUBKEY) {
            $env:REPLAYX_UPDATE_URL = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
            npm run tauri -- build --config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'
          } else {
            Remove-Item Env:REPLAYX_UPDATE_PUBKEY -ErrorAction SilentlyContinue
            npm run tauri -- build
          }
      - name: Updater manifest
        shell: pwsh
        run: ./scripts/updater-manifest.ps1 -Repository "${{ github.repository }}" -Tag "${{ github.ref_name }}"
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis -File | Where-Object { $_.Extension -in '.exe', '.sig', '.txt', '.json' }
          gh release create "${{ github.ref_name }}" --draft --prerelease --title "REPLAYX ${{ github.ref_name }}" --notes-file CHANGELOG.md $files.FullName
