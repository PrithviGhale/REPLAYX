# Builds REPLAYX from a clean checkout. Nothing is ever published automatically.
#
# - Pushing a version tag (v1.2.3 or v1.2.3-alpha.4) builds the installer and the
#   FFmpeg corresponding-source package and creates a DRAFT release for that tag.
#   A maintainer checks it (docs/RELEASING.md) and publishes it by hand.
# - Run manually without a tag: a test build only. The installer, checksums and a
#   source-package report are kept as workflow artifacts; no release is created,
#   so a run on a branch can never make a release named after the branch.
# - Run manually with an existing tag: same as pushing that tag.
# - If a release (draft or published) already exists for the tag, the run stops
#   before building: published installers are never rebuilt or overwritten.
#
# Signed in-app updates: a release build needs the repository secrets
#   TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (the private half of the key whose public half is in src-tauri/tauri.conf.json;
# see docs/RELEASING.md). The installer is signed, the signature is verified
# against the built-in public key, and latest.json is attached to the draft, so
# installed copies find the update once the release is published. A release
# without the secret fails early; test builds without it are unsigned.
name: Release (draft)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build into a new DRAFT release (for example v0.3.2-alpha.1). Leave empty for a test build that creates no release.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then tag="$REF_NAME"; else tag="${INPUT_TAG// /}"; fi
          if [[ -z "$tag" ]]; then
            echo "Test build of $REF_NAME: artifacts only, no release."
            { echo "tag="; echo "release=false"; echo "prerelease=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a version tag like v1.2.3 or v1.2.3-alpha.4."; exit 1
          fi
          if ! gh api "repos/$REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::Tag $tag does not exist. Create and push it first; this workflow never creates tags."; exit 1
          fi
          if gh release view "$tag" -R "$REPO" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            echo "::error::A release for $tag already exists. Nothing is rebuilt or overwritten. To rebuild a draft, delete the draft by hand first; never rebuild a published release."; exit 1
          fi
          pre=false; [[ "$tag" == *-* ]] && pre=true
          { echo "tag=$tag"; echo "release=true"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"
          echo "Building $tag into a new draft release (prerelease: $pre)."

  installer:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag && format('refs/tags/{0}', needs.plan.outputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Version must match the tag
        if: needs.plan.outputs.tag != ''
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ needs.plan.outputs.tag }}") { throw "Tag ${{ needs.plan.outputs.tag }} does not match package version $version" }
      - name: Cached FFmpeg archive (checksum is verified again below)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ffmpeg-n*.zip
          key: ffmpeg-${{ hashFiles('tools/ffmpeg-lock.json') }}
      - name: Pinned FFmpeg runtime
        shell: pwsh
        run: ./scripts/setup-media.ps1
      - name: Checks
        shell: pwsh
        env:
          REPLAYX_NO_HARDWARE: '1'
        run: ./scripts/check.ps1
      - name: Bundle resources
        shell: pwsh
        run: ./scripts/prepare-bundle.ps1
      - name: Update signing key (a release must be signed)
        if: needs.plan.outputs.tag != ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'The repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Installed copies only accept updates signed with the key whose public half is in src-tauri/tauri.conf.json; see docs/RELEASING.md (Signed updates).'
          }
      - name: Build installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # With the signing key: the installer plus its detached update
          # signature (.sig). Without it (test builds on forks): unsigned.
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run tauri -- build --config src-tauri/tauri.updater.conf.json
          } else {
            npm run tauri -- build
          }
          if ($LASTEXITCODE) { throw 'Installer build failed' }
      - name: Verify the update signature against the built-in public key
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = @(Get-ChildItem $dir -Filter *.exe)
          if ($exe.Count -ne 1) { throw "Expected one installer, found $($exe.Count)" }
          if (Test-Path "$($exe[0].FullName).sig") {
            node scripts/verify-update-signature.mjs $exe[0].FullName "$($exe[0].FullName).sig" --version $version
            if ($LASTEXITCODE) { throw 'The update signature does not verify; nothing will be released.' }
          } elseif ('${{ needs.plan.outputs.tag }}') {
            throw 'No update signature was produced for a release build.'
          } else {
            Write-Host 'Unsigned test build (no signing key available): no update signature to verify.'
          }
      - name: Updater manifest (latest.json)
        shell: pwsh
        run: |
          $tag = '${{ needs.plan.outputs.tag }}'
          if (-not $tag) { $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)" }
          ./scripts/updater-manifest.ps1 -Repository "${{ github.repository }}" -Tag $tag
          if ('${{ needs.plan.outputs.tag }}' -and -not (Test-Path 'src-tauri/target/release/bundle/nsis/latest.json')) { throw 'latest.json was not written for a release build.' }
      - name: Checksum
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = @(Get-ChildItem $dir -Filter *.exe)
          if ($exe.Count -ne 1) { throw "Expected one installer, found $($exe.Count)" }
          "$((Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLower())  $($exe[0].Name)" | Set-Content "$dir/INSTALLER-SHA256.txt" -Encoding ascii
          Get-Content "$dir/INSTALLER-SHA256.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/INSTALLER-SHA256.txt

  source:
    # The bundled FFmpeg is LGPL (with LGPL/MPL libraries built in): every
    # release carries the corresponding source. Built here so a release can't
    # be drafted without it.
    # Linux runner: Subversion (for LAME) comes from Ubuntu's own archive, and
    # the ~120 source fetches are faster. The script is the same one used on Windows.
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag && format('refs/tags/{0}', needs.plan.outputs.tag) || github.sha }}
          persist-credentials: false
      - name: Subversion client
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion
      - name: FFmpeg corresponding source
        shell: pwsh
        run: ./scripts/ffmpeg-source/build-package.ps1 -Out "$env:RUNNER_TEMP/ffmpeg-source" -Work "$env:RUNNER_TEMP/ffmpeg-source-work"
      - name: Source report (test builds keep only this)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-report
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ffmpeg-source/SOURCE-README.txt
            ${{ runner.temp }}/ffmpeg-source/SOURCE-SHA256.txt
            ${{ runner.temp }}/ffmpeg-source/fetch-report.json
      - name: Source package (releases only)
        if: needs.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-package
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/ffmpeg-source/ffmpeg-corresponding-source-*.tar

  draft:
    needs: [plan, installer, source]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist
          # Checked again right before creating: never touch an existing release.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $TAG appeared during the build; nothing uploaded."; exit 1
          fi
          sha256sum *.exe ffmpeg-corresponding-source-*.tar > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes="../docs/release-notes/$TAG.md"; [[ -f "$notes" ]] || notes=../CHANGELOG.md
          stage=""; [[ "$TAG" == *-alpha* ]] && stage=" — Alpha"; [[ "$TAG" == *-beta* ]] && stage=" — Beta"
          flags=(--draft --verify-tag --title "REPLAYX $TAG$stage" --notes-file "$notes")
          # Not marked pre-release: GitHub only shows a "Latest" release card for
          # regular releases. The title and tag still say Alpha/Beta.
          # The update manifest must point at exactly the files of this release.
          exe=$(ls *.exe)
          [[ -f "$exe.sig" && -f latest.json ]] || { echo "::error::The signed update files (.sig, latest.json) are missing."; exit 1; }
          want="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$exe"
          [[ "$(jq -r '.platforms["windows-x86_64"].url' latest.json)" == "$want" ]] || { echo "::error::latest.json does not point at $want"; exit 1; }
          [[ "$(jq -r '.platforms["windows-x86_64"].signature' latest.json)" == "$(tr -d '\r\n' < "$exe.sig")" ]] || { echo "::error::latest.json carries a different signature than $exe.sig"; exit 1; }
          [[ "v$(jq -r '.version' latest.json)" == "$TAG" ]] || { echo "::error::latest.json is for another version"; exit 1; }
          files=("$exe" SHA256SUMS.txt ffmpeg-corresponding-source-*.tar "$exe.sig" latest.json)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${flags[@]}" "${files[@]}"
