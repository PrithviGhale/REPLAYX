name: Windows source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Cached FFmpeg archive (checksum is verified again below)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ffmpeg-n*.zip
          key: ffmpeg-${{ hashFiles('tools/ffmpeg-lock.json') }}
      - name: Pinned FFmpeg runtime (checksum-verified)
        shell: pwsh
        run: ./scripts/setup-media.ps1
      - name: Build, unit tests and lint
        shell: pwsh
        env:
          # Hosted runners have no audio endpoints or displays.
          REPLAYX_NO_HARDWARE: '1'
        run: ./scripts/check.ps1
