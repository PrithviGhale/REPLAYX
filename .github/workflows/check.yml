name: Windows source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
          New-Item -ItemType Directory -Force src-tauri/media | Out-Null
      - name: Build, unit tests and lint
        shell: pwsh
        run: ./scripts/check.ps1
