[package]
name = "replayx"
version = "0.2.1-alpha.2"
edition = "2021"
license = "MIT"
default-run = "replayx"

[lib]
name = "replayx_core"

[[bin]]
name = "replayx"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "replayx-cli"
path = "src/bin/cli.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
wasapi = "0.26"
sysinfo = "0.37"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_JobObjects", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_Media_Audio", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
