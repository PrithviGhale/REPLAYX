<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0b0c10"/>
<title>REPLAYX</title>
<style>
/* Startup splash. Painted with the first HTML byte, before any script, and
   removed as soon as the app is really ready (src/splash.ts). Never waits for
   its own animation; a CSS-only timeout hides it even if scripts fail. */
html,body{margin:0;height:100%;background:#0b0c10}
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;will-change:opacity,transform;background:radial-gradient(60% 50% at 50% 46%,rgba(124,104,255,.16),rgba(124,104,255,0) 70%),#0b0c10;color:#e9e9f1;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;transition:opacity .32s cubic-bezier(.4,0,.2,1),transform .32s cubic-bezier(.4,0,.2,1),visibility 0s linear .32s;animation:splash-giveup .3s 25s forwards}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.035)}
#splash.out .wrap{transform:translateY(-14px);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.app-enter .shell{animation:app-in .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes app-in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
#splash .wrap{display:grid;justify-items:center;gap:14px;transform:translateY(-8px)}
#splash .mark{position:relative;width:78px;height:78px;display:grid;place-items:center}
#splash .tile{width:58px;height:58px;border-radius:17px;background:linear-gradient(145deg,#8b7cff,#6a55ff);box-shadow:0 10px 34px rgba(106,85,255,.45),inset 0 1px 0 rgba(255,255,255,.25);display:grid;place-items:center;animation:splash-in .55s cubic-bezier(.2,.8,.2,1) both}
#splash .ring{position:absolute;inset:0;animation:splash-spin 2.4s linear infinite}
#splash .ring circle{fill:none;stroke:url(#sg);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:60 190;animation:splash-draw .9s .15s cubic-bezier(.2,.8,.2,1) both}
#splash .word{font-size:25px;font-weight:700;letter-spacing:.2em;padding-left:.2em;animation:splash-up .5s .12s cubic-bezier(.2,.8,.2,1) both}
#splash .word b{color:#9b8cff}
#splash .tag{font-size:12.5px;color:#8c8ca0;letter-spacing:.02em;margin-top:-8px;animation:splash-up .5s .2s cubic-bezier(.2,.8,.2,1) both}
#splash .bar{width:168px;height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
#splash .bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,transparent,#8b7cff,transparent);animation:splash-slide 1.1s ease-in-out infinite}
#splash .step{font-size:12px;color:#77778c;min-height:16px}
@keyframes splash-in{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes splash-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes splash-draw{from{stroke-dashoffset:250;opacity:0}to{stroke-dashoffset:0;opacity:1}}
@keyframes splash-spin{to{transform:rotate(360deg)}}
@keyframes splash-slide{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
@keyframes splash-giveup{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash *,#splash{animation:none!important}#splash,#splash .wrap{transition:none;transform:none}.app-enter .shell{animation:none}#splash .bar i{width:100%;opacity:.35}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-label="REPLAYX is starting">
  <div class="wrap">
    <!-- BRAND-MARK:start  (replace with the approved logo; see docs/BRANDING.md) -->
    <div class="mark" aria-hidden="true">
      <svg class="ring" viewBox="0 0 78 78"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3a8ff"/><stop offset="1" stop-color="#6a55ff" stop-opacity=".2"/></linearGradient></defs><circle cx="39" cy="39" r="37"/></svg>
      <div class="tile">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23.6 9.4A9.6 9.6 0 1 0 25.6 16"/><path d="M25.8 6.2v4.6h-4.6"/><path d="M13.6 11.8v8.4l6.6-4.2z" fill="#fff" stroke-width="1.6"/>
        </svg>
      </div>
    </div>
    <!-- BRAND-MARK:end -->
    <div class="word">REPLAY<b>X</b></div>
    <div class="tag">Capture everything. Miss nothing.</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="step">Loading interface</div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
